<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MayWatch Vue Numeric Monitoring Fixture</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; margin: 32px; background: #0f172a; color: #e2e8f0; }
    .card { max-width: 520px; padding: 24px; border: 1px solid #25405f; border-radius: 18px; background: #12213a; }
    .metric { display: flex; justify-content: space-between; margin: 14px 0; font-size: 18px; }
    .value { color: #34d399; font-variant-numeric: tabular-nums; }
    button { margin-right: 8px; padding: 8px 12px; border: 0; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <main id="app" class="card">
    <h1>Vue Checkout Funnel</h1>
    <div class="metric">hourly revenue <strong id="vue-revenue" class="value">{{ current.revenue }}</strong></div>
    <div class="metric">conversion rate <strong id="vue-conversion-rate" class="value">{{ current.conversion }}</strong></div>
    <button id="vue-baseline-toggle" @click="mode = 'baseline'">Baseline</button>
    <button id="vue-drop-toggle" @click="mode = 'drop'">Drop</button>
    <button id="vue-placeholder-toggle" @click="mode = 'placeholder'">Placeholder refresh</button>
  </main>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';

    createApp({
      data() {
        return {
          mode: 'baseline',
          states: {
            baseline: { revenue: '$42,810.50', conversion: 'Conversion 7.2%' },
            drop: { revenue: '$31,204.10', conversion: 'Conversion 4.9%' },
            placeholder: { revenue: 'Loading...', conversion: '暂无数据' },
          },
        };
      },
      computed: {
        current() {
          return this.states[this.mode];
        },
      },
    }).mount('#app');
  </script>
</body>
</html>
