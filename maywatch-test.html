<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MayWatch Numeric Tracking Test</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b16;
      color: #eef2ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.25), transparent 34rem),
        radial-gradient(circle at 80% 30%, rgba(14, 165, 233, 0.18), transparent 30rem),
        #080b16;
    }

    main {
      width: min(760px, calc(100vw - 48px));
      display: grid;
      gap: 24px;
    }

    .eyebrow {
      margin: 0;
      color: #93c5fd;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    #heroRevenue {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.62));
      box-shadow: 0 28px 90px rgba(15, 23, 42, 0.55);
    }

    #heroRevenue .label {
      display: block;
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #heroRevenue .value {
      display: block;
      margin-top: 12px;
      color: #f8fafc;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.06em;
    }

    #heroRevenue .state {
      display: block;
      margin-top: 8px;
      color: #94a3b8;
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: #6366f1;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: rgba(148, 163, 184, 0.16);
      color: #dbeafe;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MayWatch verification page</p>
    <h1>Numeric trend tracking with placeholder refresh.</h1>

    <section id="heroRevenue" aria-live="polite">
      <span class="label">Hero Revenue</span>
      <strong class="value">$120</strong>
      <span class="state">live sample</span>
    </section>

    <div class="controls">
      <button id="nextRevenue" type="button">Next revenue sample</button>
      <button id="placeholderRefresh" type="button" class="secondary">Placeholder refresh</button>
      <button id="resetRevenue" type="button" class="secondary">Reset</button>
    </div>
  </main>

  <script>
    const revenueCard = document.getElementById('heroRevenue');
    let revenue = 120;

    function formatRevenue(value) {
      return `$${Number(value).toLocaleString('en-US')}`;
    }

    function renderRevenue(value, stateText = 'live sample') {
      revenue = Number(value);
      revenueCard.innerHTML = `
        <span class="label">Hero Revenue</span>
        <strong class="value">${formatRevenue(revenue)}</strong>
        <span class="state">${stateText}</span>
      `;
      return revenueCard.innerText;
    }

    function renderPlaceholder() {
      revenueCard.innerHTML = `
        <span class="label">Hero Revenue</span>
        <strong class="value">Loading...</strong>
        <span class="state">placeholder refresh</span>
      `;
      return revenueCard.innerText;
    }

    window.maywatchTest = {
      setRevenue: value => renderRevenue(value),
      nextRevenue: () => renderRevenue(revenue + 5, 'new sample'),
      showPlaceholder: () => renderPlaceholder(),
      reset: () => renderRevenue(120, 'live sample'),
      read: () => revenueCard.innerText,
    };

    document.getElementById('nextRevenue').addEventListener('click', () => {
      window.maywatchTest.nextRevenue();
    });

    document.getElementById('placeholderRefresh').addEventListener('click', () => {
      renderPlaceholder();
      window.setTimeout(() => renderRevenue(revenue, 'live sample'), 1200);
    });

    document.getElementById('resetRevenue').addEventListener('click', () => {
      window.maywatchTest.reset();
    });
  </script>
</body>
</html>
